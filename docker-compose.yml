services:

  ai-agent:
    build:
      context: ./ai-agent
    container_name: smartaway-ai
    env_file:
      - ./ai-agent/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: smartaway-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 5002
      NODE_ENV: production
      AI_URL_PROD: http://ai-agent:8000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      COOKIE_SECURE: "false"
    ports:
      - "5002:5002"
    depends_on:
      - ai-agent
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: smartaway-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "0"

volumes:
  jenkins_home: